name: Refresh policy data

# The rules engine is updated upstream as statute changes. This opens a pull
# request when a fresh run of the pipeline produces different numbers, so a
# human reviews the diff before the published site changes.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/generate_grid.py --out src/data/grid.json
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: refresh policy grid from the rules engine"
          branch: data/refresh
          title: "Refresh policy grid"
          body: |
            A scheduled run of `pipeline/generate_grid.py` produced different
            output from the committed grid. Review the diff before merging:
            a change here changes every dollar figure the site publishes.
